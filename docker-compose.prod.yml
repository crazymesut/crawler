services:
  puppeteer-api:
    image: ghcr.io/crazymesut/crawler:latest
    platform: linux/amd64
    pull_policy: always
    env_file:
      - .env
    shm_size: '1gb'
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
